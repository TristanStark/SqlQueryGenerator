name: Verify v32 release publication

on:
  push:
    branches:
      - "agent/fix-join-dnd-ui-version"
    paths:
      - ".github/workflows/check-v32-release.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v7

      - name: Wait for release and capture metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .agent
          for attempt in $(seq 1 18); do
            if gh release view v32.0.0 --json url,tagName,isDraft,isPrerelease,assets > .agent/release-status.json; then
              python - <<'PY'
          import json
          from pathlib import Path

          path = Path('.agent/release-status.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assets = data.get('assets') or []
          expected = 'SqlQueryGenerator-win-x64-portable.zip'
          if not any(asset.get('name') == expected for asset in assets):
              raise SystemExit(f'Release exists but expected asset {expected} is missing.')
          print(json.dumps(data, indent=2))
          PY
              exit 0
            fi
            sleep 5
          done
          echo "Release v32.0.0 was not published in time." >&2
          exit 1

      - name: Record verification result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agent/release-status.json
          git commit -m "Record v32 release verification [release verified]"
          git push
