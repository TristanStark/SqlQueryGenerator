name: Apply prepared source transformations

on:
  push:
    branches:
      - "agent/fix-join-dnd-ui-version"
    paths:
      - ".agent/apply_changes.py"
      - ".github/workflows/apply-agent-changes.yml"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[agent patch applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply transformations
        run: python .agent/apply_changes.py

      - name: Commit transformed sources
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes were produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/SqlQueryGenerator.App/ViewModels/MainViewModel.cs \
                  src/SqlQueryGenerator.App/MainWindow.xaml \
                  src/SqlQueryGenerator.App/MainWindow.xaml.cs
          git commit -m "Improve join editing and file workflows [agent patch applied]"
          git push
