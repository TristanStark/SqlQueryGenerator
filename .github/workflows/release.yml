name: Release

on:
  push:
    branches: [ "master" ]
    tags:
      - "v*.*.*"
    paths:
      - "src/SqlQueryGenerator.App/SqlQueryGenerator.App.csproj"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build release package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          }
          else {
            [xml]$project = Get-Content ".\src\SqlQueryGenerator.App\SqlQueryGenerator.App.csproj"
            $version = @($project.Project.PropertyGroup.Version)[0]
            if ([string]::IsNullOrWhiteSpace($version)) {
              throw "Unable to resolve the application Version from the project file."
            }
            $tag = "v$version"
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Release tag: $tag"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\SqlQueryGenerator.sln

      - name: Test
        run: dotnet test .\SqlQueryGenerator.sln --configuration Release --verbosity normal

      - name: Build portable ZIP
        shell: pwsh
        run: .\package-portable-win-x64.ps1

      - name: Create tag when releasing from master
        if: github.ref_type != 'tag'
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          git fetch --tags --force
          if (-not (git tag --list $tag)) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a $tag -m "SqlQueryGenerator $tag"
            git push origin $tag
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SqlQueryGenerator-${{ steps.version.outputs.tag }}-win-x64
          path: artifacts/**/*.zip

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          if (gh release view $tag 2>$null) {
            Write-Host "Release $tag already exists; leaving it unchanged."
            exit 0
          }

          gh release create $tag artifacts/**/*.zip `
            --verify-tag `
            --title "SqlQueryGenerator $tag" `
            --generate-notes
